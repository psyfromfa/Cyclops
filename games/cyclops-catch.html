<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Cyclops: Catch It!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./cyclops-catch.css?v=catch-hud-card-0526" />
  </head>
  <body>
    <main class="catch-shell" aria-label="Cyclops: Catch It!">
      <canvas id="catch-canvas" width="540" height="960"></canvas>

      <section class="hud" aria-label="Game status">
        <div class="hud-score">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-lives">
          <span>Lives</span>
          <strong id="lives">3</strong>
        </div>
        <div class="hud-audio" aria-label="Audio controls">
          <button id="music-toggle" class="music-toggle" type="button" aria-pressed="true" aria-label="Pause music"></button>
          <div class="audio-sliders">
            <label class="audio-slider" for="music-volume">
              <span>Music</span>
              <input id="music-volume" type="range" min="0" max="100" value="18">
            </label>
            <label class="audio-slider" for="sfx-volume">
              <span>Sounds</span>
              <input id="sfx-volume" type="range" min="0" max="100" value="70">
            </label>
          </div>
        </div>
      </section>

      <button id="visor-button" class="visor-meter" type="button" disabled aria-label="Visor blast unavailable">
        <span class="visor-copy">
          <span>Visor</span>
          <strong id="visor-value">0%</strong>
        </span>
        <span class="visor-track" aria-hidden="true">
          <span id="visor-fill"></span>
        </span>
        <span class="visor-ready">Space</span>
      </button>

      <section id="start-screen" class="screen-panel">
        <h1>Catch It!</h1>
        <p>Move Cyclops, catch icons, and dodge bombs. Fill the visor gauge and use it to clear the screen!</p>
        <button id="start-btn" class="arcade-button" type="button">Play</button>
      </section>

      <section id="pause-screen" class="screen-panel compact" hidden>
        <p class="eyebrow">Paused</p>
        <h2>Still got one eye on it.</h2>
        <button id="resume-btn" class="arcade-button" type="button">Resume</button>
      </section>

      <section id="gameover-screen" class="screen-panel" hidden>
        <p class="eyebrow">Run over</p>
        <h2 id="gameover-title">GGEZ?</h2>
        <p id="gameover-copy">Final score: 0</p>
        <form id="score-form" class="score-form">
          <label for="score-name">Initials</label>
          <div class="score-row">
            <input id="score-name" name="score-name" type="text" maxlength="3" autocomplete="nickname" inputmode="text" placeholder="CAT" />
            <button id="score-save" class="arcade-button mini" type="submit">Save</button>
          </div>
          <p id="score-message" class="score-message" aria-live="polite">Save your run for the ranks.</p>
        </form>
        <section class="leaderboard-card" aria-label="Catch it leaderboard">
          <div class="leaderboard-head">
            <span>Ranks</span>
            <strong id="leaderboard-status">local ranks</strong>
          </div>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
        </section>
        <button id="retry-btn" class="arcade-button" type="button">Run it back</button>
      </section>

      <p id="callout" class="callout" aria-live="polite">Move Cyclops with your mouse or finger.</p>
    </main>

    <script src="./cyclops-catch.js?v=catch-hud-card-0526"></script>
  </body>
</html>
