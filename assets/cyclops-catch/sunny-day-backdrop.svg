<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960" preserveAspectRatio="xMidYMid slice" role="img" aria-label="bright sunny day game backdrop">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#38c8ff"/>
      <stop offset=".52" stop-color="#9feeff"/>
      <stop offset="1" stop-color="#fff1ad"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff36e" stop-opacity=".95"/>
      <stop offset=".48" stop-color="#ffe05a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff36e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frontHill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3ee377"/>
      <stop offset="1" stop-color="#16a351"/>
    </linearGradient>
    <linearGradient id="backHill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#75e895"/>
      <stop offset="1" stop-color="#28b962"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8c5a2e"/>
      <stop offset="1" stop-color="#4b2418"/>
    </linearGradient>
    <pattern id="grassBits" width="34" height="20" patternUnits="userSpaceOnUse">
      <path d="M5 18c4-8 7-8 9 0M18 18c2-8 6-11 9-1" fill="none" stroke="#15944a" stroke-width="2" stroke-linecap="round" opacity=".38"/>
    </pattern>
    <pattern id="dirtDots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="15" r="3" fill="#b97838" opacity=".42"/>
      <circle cx="28" cy="30" r="4" fill="#32170f" opacity=".22"/>
      <circle cx="36" cy="10" r="2.5" fill="#d09247" opacity=".32"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#135f3d" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="540" height="960" fill="url(#sky)"/>
  <circle cx="417" cy="132" r="118" fill="url(#sunGlow)"/>
  <circle cx="417" cy="132" r="50" fill="#ffe65d"/>

  <g fill="#fff" filter="url(#softShadow)">
    <path d="M72 159c16-31 61-33 79-2 26-13 58 8 56 41H31c0-29 23-48 41-39z" opacity=".92"/>
    <path d="M343 218c16-29 57-31 75-2 24-11 53 8 52 38H298c0-26 25-45 45-36z" opacity=".88"/>
    <path d="M255 97c12-22 43-23 56-1 19-9 42 5 41 29H218c0-23 20-36 37-28z" opacity=".78"/>
  </g>

  <path d="M0 565c72-50 145-53 220-10 82 47 158 51 244-3 31-19 56-28 76-32v440H0z" fill="url(#backHill)"/>
  <path d="M0 654c64-41 134-39 219 2 82 39 160 29 236-21 34-22 62-33 85-38v363H0z" fill="#20b965"/>
  <path d="M0 731c68-26 137-23 216 12 76 34 151 29 229-10 38-19 70-28 95-29v256H0z" fill="url(#frontHill)"/>

  <rect x="0" y="760" width="540" height="36" fill="#2bd76a" stroke="#0f7e3f" stroke-width="6"/>
  <rect x="0" y="788" width="540" height="172" fill="url(#ground)"/>
  <rect x="0" y="788" width="540" height="172" fill="url(#dirtDots)"/>
  <rect x="0" y="751" width="540" height="46" fill="url(#grassBits)" opacity=".75"/>

  <path d="M0 0h540v960H0z" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="12"/>
  <path d="M0 0h540v960H0z" fill="none" stroke="#000000" stroke-opacity=".08" stroke-width="18"/>
</svg>
